<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#292b2c"><title>Both Sides — Compare perspectives</title>
<link rel="stylesheet" href="./style.css"></head><body><div class="shell"><header><div class="wordmark"><span class="mark" aria-hidden="true"></span>Both Sides</div><div class="progress" id="step"></div></header><main><div class="hero"><h1 id="title" tabindex="-1"></h1><div id="avatar-slot" class="avatar" role="img" aria-label="Round lime and mint avatar with a white outline and a two-dot face">
<span class="orb-poster" aria-hidden="true"></span>
<spline-viewer url="https://prod.spline.design/1WPMwYarjzm8SXqb/scene.splinecode" background="rgba(0,0,0,0)" loading="eager"></spline-viewer>
<span id="avatar-message" aria-hidden="true"></span>
</div><p id="intro"></p></div><div id="app"></div></main><footer class="foot"><span>Private to this tab</span><span>A / B</span></footer><span class="sr" role="status" id="live"></span></div>

<dialog id="portrait-dialog" aria-labelledby="portrait-title">
  <div class="portrait-heading"><h2 id="portrait-title">Choose a portrait</h2><button type="button" data-dismiss aria-label="Cancel portrait changes">×</button></div>
  <div class="portrait-scroll">
    <div class="portrait-grid" role="group" aria-label="Portrait shapes"></div>
    <label class="tone-label" for="portrait-tone">Color</label>
    <input id="portrait-tone" type="range" min="0" max="100" step="1" value="45">
    <div class="temperature-ends"><span>Cool</span><span>Warm</span></div>
    <div class="color-presets" role="group" aria-label="Gradient suggestions"></div>
  </div>
  <div class="portrait-footer"><div class="portrait-preview" aria-hidden="true"></div><div><strong>Preview</strong><div class="preview-name"></div></div><button type="button" class="primary" data-apply>Use portrait</button></div>
</dialog>
<script src="./portraits.js"></script>
<script src="./app.js"></script>
</body></html>
